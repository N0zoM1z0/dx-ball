name: Public build and tracking
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install hash-pinned analysis packages
        run: scripts/bootstrap-python.sh
      - name: Build portable source and validate recorded evidence
        run: scripts/repo-python scripts/ci.py --public
      - name: Install i686 Windows compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-mingw-w64-i686 ninja-build
      - name: Compile Windows adapter and game with strict warnings
        run: scripts/repo-python scripts/build-windows.py
