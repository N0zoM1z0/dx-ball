name: Public build and tracking
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install hash-pinned analysis packages
        run: scripts/bootstrap-python.sh
      - name: Build portable source and validate recorded evidence
        run: scripts/repo-python scripts/ci.py --public
      - name: Check campaign archival identities without private assets
        run: scripts/repo-python tests/test_campaign_retention.py
      - name: Install i686 Windows compiler
        run: |
          sudo apt-get update
          # Match the POSIX compiler used by local Windows probes and avoid
          # downloading the additional win32 compiler/runtime variant.
          sudo apt-get install --no-install-recommends -y gcc-mingw-w64-i686-posix ninja-build
      - name: Compile Windows adapter and game with strict warnings
        run: scripts/repo-python scripts/build-windows.py --without-game-resources
      - name: Compile persistent campaign observer with strict C90 warnings
        run: scripts/repo-python tests/test_windows_campaign.py --compile-only
