# Explicit evidence inputs for each maintained owner. All inputs are hash-bound
# in accepted rows; changing a shared header/oracle requires a fresh replay.
[owners.boards]
source = "src/boards.c"
header = "src/boards.h"
oracle = "tests/test_boards_differential.py"
target_oracle = "tests/target_oracle.py"
additional_inputs = []

[owners.resources]
source = "src/resources.c"
header = "src/resources.h"
oracle = "tests/test_resources_differential.py"
target_oracle = "tests/resources_oracle.py"
additional_inputs = ["src/boards.h", "tests/target_oracle.py"]

[owners.gameplay]
source = "src/gameplay.c"
header = "src/gameplay.h"
oracle = "tests/test_gameplay_differential.py"
target_oracle = "tests/target_oracle.py"
additional_inputs = ["src/boards.c", "src/boards.h", "src/effects.c", "src/effects.h", "src/particles.c", "src/particles.h", "src/bonuses.c", "src/bonuses.h", "src/resources.h", "tests/test_boards_differential.py", "config/assets.csv"]

[owners.effects]
source = "src/effects.c"
header = "src/effects.h"
oracle = "tests/test_effects_differential.py"
target_oracle = "tests/target_oracle.py"
additional_inputs = ["src/boards.c", "src/boards.h", "src/gameplay.c", "src/gameplay.h", "src/particles.c", "src/particles.h", "src/bonuses.c", "src/bonuses.h", "src/resources.h", "tests/test_boards_differential.py", "tests/test_gameplay_differential.py"]

[owners.particles]
source = "src/particles.c"
header = "src/particles.h"
oracle = "tests/test_entities_differential.py"
target_oracle = "tests/target_oracle.py"
additional_inputs = ["src/boards.c", "src/boards.h", "src/gameplay.c", "src/gameplay.h", "src/effects.c", "src/effects.h", "src/bonuses.c", "src/bonuses.h", "src/resources.h", "tests/test_boards_differential.py", "tests/test_gameplay_differential.py", "tests/test_effects_differential.py", "tests/resources_oracle.py"]

[owners.bonuses]
source = "src/bonuses.c"
header = "src/bonuses.h"
oracle = "tests/test_entities_differential.py"
target_oracle = "tests/target_oracle.py"
additional_inputs = ["src/boards.c", "src/boards.h", "src/gameplay.c", "src/gameplay.h", "src/effects.c", "src/effects.h", "src/particles.c", "src/particles.h", "src/resources.h", "tests/test_boards_differential.py", "tests/test_gameplay_differential.py", "tests/test_effects_differential.py", "tests/resources_oracle.py"]
