# Full one-function COMDAT extents; every relocation is applied, none masked.
[build]
source = "src/boards.c"
object = "build/exact/boards.obj"
inputs = ["src/boards.c", "src/boards.h"]
flags = ["/nologo", "/c", "/Od", "/Ob0", "/Oi-", "/Oy-", "/Gd", "/MT", "/Gy"]

[units]

[units.select-surface]
symbol = "_dxball_select_surface"
target_address = 0x00403E50
size = 24
boundary_evidence = "docs/BUILD_MATCHING.md"
relocations = [
  { offset = 0xA, type = "DIR32", symbol = "_dxball_active_surface", addend = 0, target = 0x004265CC },
]

[units.load-editor-board]
